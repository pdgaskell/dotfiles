# =========================
# Core / General
# =========================

set -g default-shell /usr/bin/zsh

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g detach-on-destroy off

set -g escape-time 0
set -g focus-events on
set -g mouse on

# Truecolor support
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# =========================
# Prefix
# =========================

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# =========================
# Status bar (Solarized Dark)
# =========================

set -g set-titles on
set -g set-titles-string "tmux: #S on #H"

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=#93a1a1"
set -g status-justify left

set -g status-left-length 60
set -g status-left "#[fg=#002b36,bg=#268bd2,bold] #T #[fg=#268bd2,bg=default,nobold] "


set -g status-right "#[fg=#2aa198]%a %d %b #[fg=#268bd2,bold]%H:%M"

# Window tabs
setw -g window-status-format "#[fg=#657b83,bg=default] #I:#W "
setw -g window-status-current-format "#[fg=#002b36,bg=#268bd2,bold] #I:#W #[fg=#268bd2,bg=default,nobold]"
setw -g window-status-separator ""

# =========================
# Panes
# =========================

set -g pane-border-style "fg=#586e75"
set -g pane-active-border-style "fg=#268bd2"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# =========================
# Window management
# =========================

bind -r n next-window
bind -r p previous-window
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Switch windows using Alt + Number without prefix
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# =========================
# Copy mode (vi)
# =========================

setw -g mode-keys vi
set -g status-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi r send -X rectangle-toggle

# search in copy mode
bind -T copy-mode-vi / command-prompt -p "search down" "send -X search-forward '%%'"
bind -T copy-mode-vi ? command-prompt -p "search up" "send -X search-backward '%%'"

set -g set-clipboard on

bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# =========================
# Misc keybindings
# =========================

bind Space last-window
bind r source-file ~/.tmux.conf \; display "Reloaded"

bind -n M-c command-prompt -p "command:" "new-window '%%'"
