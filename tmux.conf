# =========================
# Core / General
# =========================

set -g default-shell /bin/zsh

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g detach-on-destroy off

set -g escape-time 0
set -g focus-events on
set -g mouse on

# Truecolor support
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# =========================
# Prefix
# =========================

unbind C-b
set -g prefix C-s
bind C-s send-prefix

# =========================
# Status bar (terminal ANSI palette; follows Ghostty light/dark theme)
# =========================

set -g set-titles on
set -g set-titles-string "tmux: #S on #H"

set -g status-position bottom
set -g status-interval 1
set -g status-style "bg=default,fg=default"
set -g status-justify left
set -g message-style "bg=colour0,fg=default,fill=colour0"
set -g message-command-style "bg=colour0,fg=colour5,bold,fill=colour0"

set -g status-left-length 60
set -g status-left "#[fg=colour5] #T #[fg=default]#{?client_prefix, #[fg=colour5,reverse,bold] PREFIX #[noreverse,nobold,fg=default],}"

set -g status-right "#[fg=colour7]%a %d %b #[fg=colour12,bold]%H:%M"

# Window tabs
setw -g window-status-format "#[fg=colour15,bg=default] #I:#W "
setw -g window-status-current-format "#[fg=default,bg=colour0,bold] #I:#W #[fg=colour0,bg=default,nobold]"
setw -g window-status-separator ""

# =========================
# Panes
# =========================

set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -r C-b select-pane -L
bind -r C-f select-pane -R
bind -r C-p select-pane -U
bind -r C-n select-pane -D

# Emacs-style pane resizing
bind -r M-b resize-pane -L 5
bind -r M-f resize-pane -R 5
bind -r M-p resize-pane -U 5
bind -r M-n resize-pane -D 5

# =========================
# Window management
# =========================

bind -r n next-window
bind -r p previous-window
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Switch windows using Alt + Number without prefix
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# =========================
# Copy mode (Emacs)
# =========================

setw -g mode-keys vi
set -g status-keys emacs
set -g mode-style "fg=default,bg=colour0"

# Copy selection and exit
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# Mouse selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# =========================
# Misc keybindings
# =========================

bind Space last-window
bind r source-file ~/.tmux.conf \; display "Reloaded"

bind -n M-c command-prompt -p "command:" "new-window '%%'"
