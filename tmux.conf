# --- Prefix ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- Terminal / true colour ---
set -g default-terminal "tmux-256color"
set -sa terminal-features ",xterm-256color:RGB"
set -ag terminal-overrides ",*:RGB"

# --- General ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse off

set -g terminal-overrides ',*:smcup@:rmcup@'

set -g escape-time 0
set -g history-limit 50000
set -g focus-events off
set -g detach-on-destroy off

# --- Status bar ---
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=#93a1a1"

# Left: session name
set -g status-left-length 30
set -g status-left \
"#[fg=#002b36,bg=#268bd2,bold] #S #[fg=#268bd2,bg=default,nobold] "

# Right: git + date/time
set -g status-right-length 80
set -g status-right '\
#(gitmux -cfg ~/.gitmux.conf "#{pane_current_path}") \
#[fg=#2aa198] %a %d %b \
#[fg=#268bd2,bold]%H:%M '

# --- Window tabs (Solarized Dark friendly) ---
set -g status-justify left

# Inactive windows
setw -g window-status-format \
"#[fg=#657b83,bg=default] #I:#W "

# Active window
setw -g window-status-current-format \
"#[fg=#002b36,bg=#268bd2,bold] #I:#W #[fg=#268bd2,bg=default,nobold]"

setw -g window-status-separator ""

# --- Pane borders ---
set -g pane-border-style "fg=#586e75"
set -g pane-active-border-style "fg=#268bd2"

# --- Keybindings ---
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Splits preserve cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Quick command prompt
bind -n M-c command-prompt -p "command:" "new-window '%%'"

# Window navigation
bind -r n next-window
bind -r p previous-window

# Window reordering
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# --- Resize panes ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Vi copy mode ---
setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

