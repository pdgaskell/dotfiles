# --- Prefix ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- Terminal colours ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# --- General ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse off
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on
set -g detach-on-destroy off

# --- Status bar ---
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=colour7"
 
# Left: session name
set -g status-left-length 30
set -g status-left "#[fg=colour0,bg=colour4,bold] #S #[fg=colour4,bg=default,nobold] "
 
# Right: git + date/time
set -g status-right-length 80
set -g status-right '\
#(gitmux -cfg ~/.gitmux.conf "#{pane_current_path}")\
#[nobold,fg=colour6] %a %d %b \
#[fg=colour4,bold]%H:%M '
 
# Window tabs
set -g status-justify left
setw -g window-status-format "#[fg=colour12] #I:#W "
setw -g window-status-current-format "#[fg=colour0,bg=colour4,bold] #I:#W #[fg=colour4,bg=default,nobold]"
setw -g window-status-separator ""
 
# Pane borders
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"
 
# --- Keybindings ---
bind r source-file ~/.tmux.conf \; display "Reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-c command-prompt -p "command:" "new-window '%%'"
bind -r n next-window
bind -r p previous-window
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

